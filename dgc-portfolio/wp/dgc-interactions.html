<style id="dgc-interactions-css">
/* Header states (toggled by the script below) */
.dgc-hdr.is-scrolled { transform: translateY(-50px); }
.dgc-hdr.is-scrolled .dgc-hdr-top { opacity: 0; pointer-events: none; }
.dgc-hdr.is-scrolled .dgc-nav { background: rgba(4,32,44,.92); border-color: rgba(255,255,255,.35); }
@media (max-width: 767px) { .dgc-hdr.is-scrolled { transform: translateY(-44px); } }
body.admin-bar .dgc-hdr { top: 32px; }
@media (max-width: 782px) { body.admin-bar .dgc-hdr { top: 46px; } }
.elementor .dgc-navlink.is-current { color: #1cdee1; }
@media (max-width: 1024px) {
  .elementor .dgc-navlinks.is-open { display: flex !important; position: absolute; top: calc(100% + 8px); left: 0; right: 0; flex-direction: column; align-items: stretch; gap: 2px; margin: 0; padding: 12px 16px 18px; border-radius: 10px; border: 1px solid rgba(255,255,255,.3); background: rgba(4,32,44,.97); }
  .elementor .dgc-navlinks.is-open .dgc-navlink { text-align: left; padding: 12px 10px; }
}
/* Back to top */
.elementor .dgc-totop.is-on { opacity: 1; transform: translateY(0); pointer-events: auto; }
/* Hero: highlighted words in the heading */
.elementor .dgc-hero-h1 span:nth-of-type(1) { display: inline-block; padding: 0 .16em .04em; border-radius: 10px; background: linear-gradient(90deg, #fb8e28, #f6a440); color: #021720; box-shadow: 0 16px 34px -14px rgba(251,142,40,.8); }
.elementor .dgc-hero-h1 span:nth-of-type(2) { color: transparent; -webkit-text-stroke: 1.5px #22c8cc; }
.elementor .dgc-rate b { color: #fff; }
.elementor .dgc-face:first-child { margin-left: 0; }
/* Motion (Elementor drops animation declarations from atomic styles, so they live here) */
@keyframes dgc-spin { to { transform: rotate(360deg); } }
@keyframes dgc-pan { 0%, 8% { object-position: top; } 92%, 100% { object-position: bottom; } }
@keyframes dgc-bob { 50% { transform: translateY(-10px); } }
.elementor .dgc-spin { animation: dgc-spin 18s linear infinite; }
.elementor .dgc-badge:hover .dgc-spin { animation-duration: 6s; }
.elementor .dgc-pan { animation: dgc-pan 16s ease-in-out infinite alternate; }
.elementor .dgc-screen:nth-of-type(2) .dgc-pan { animation-delay: -5s; }
.elementor .dgc-screen:nth-of-type(3) .dgc-pan { animation-delay: -10s; }
.elementor .dgc-bob { animation: dgc-bob 6s ease-in-out infinite; animation-delay: -3s; }
.elementor .dgc-btn .ico-arrow-ur { transition: transform .25s; }
.elementor .dgc-btn:hover .ico-arrow-ur { transform: translate(2px, -2px); }
/* Video reviews strip + industries ribbon */
@keyframes dgc-slide { to { transform: translateX(-50%); } }
@keyframes dgc-pulse { 50% { box-shadow: 0 0 0 9px rgba(60,207,110,0); } }
.elementor .dgc-live-dot { animation: dgc-pulse 2s infinite; }
.elementor .dgc-track.is-ready { animation: dgc-slide 90s linear infinite; }
.elementor .dgc-track:has(.dgc-vthumb:hover) { animation-play-state: paused; }
.elementor .dgc-rtrack.is-ready { animation: dgc-slide 50s linear infinite reverse; }
.elementor .dgc-vlist:has(.dgc-vthumb:hover) .dgc-vthumb:not(:hover) { opacity: .3; filter: grayscale(.6) blur(1px); }
.elementor .dgc-vthumb:hover { z-index: 5; transform: scale(1.22); }
.elementor .dgc-vthumb:hover .dgc-vbtn { border-color: #f6a440; box-shadow: 0 30px 60px -20px rgba(0,0,0,.85), 0 0 0 4px #f6a440; }
.elementor .dgc-vthumb:hover .dgc-play { transform: scale(1.15); background: #fff; box-shadow: 0 0 0 10px rgba(255,255,255,.25); }
.elementor .dgc-vthumb:hover .dgc-vcap { opacity: 0; }
.elementor .dgc-rword::after { content: "\273A"; font-size: .9rem; }
/* Stats */
.elementor .dgc-stat-num sup { font-size: .5em; color: #f6a440; vertical-align: top; position: relative; top: .15em; margin-left: 2px; }
.elementor .dgc-stat + .dgc-stat::before { content: ""; position: absolute; left: 0; top: 18%; bottom: 18%; width: 3px; border-radius: 3px; background: linear-gradient(180deg, #f6a440, #1cdee1); opacity: .85; }
.elementor .dgc-stat::after { content: ""; position: absolute; left: 30%; right: 30%; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: #f6a440; transform: scaleX(0); transition: transform .35s; }
.elementor .dgc-stat:hover::after { transform: scaleX(1); }
@media (max-width: 1024px) {
  .elementor .dgc-stat + .dgc-stat::before { display: none; }
  .elementor .dgc-stat { border-right: 2px solid #d3e2e6; border-bottom: 2px solid #d3e2e6; }
  .elementor .dgc-stat:nth-child(3n) { border-right: 0; }
  .elementor .dgc-stat:nth-child(n+4) { border-bottom: 0; }
}
@media (max-width: 767px) {
  .elementor .dgc-stat, .elementor .dgc-stat:nth-child(3n), .elementor .dgc-stat:nth-child(n+4) { border-right: 2px solid #d3e2e6; border-bottom: 2px solid #d3e2e6; }
  .elementor .dgc-stat:nth-child(even) { border-right: 0; }
  .elementor .dgc-stat:last-child { grid-column: 1 / -1; border-right: 0; border-bottom: 0; }
}
/* Video popup */
.dgc-vmodal { width: fit-content; max-width: 94vw; padding: 0; border: 0; border-radius: 10px; background: #000; overflow: visible; }
.dgc-vmodal::backdrop { background: rgba(2,23,32,.9); }
.dgc-vmodal__frame { border-radius: 10px; overflow: hidden; background: #000; }
.dgc-vmodal__bar { padding: 10px 14px; background: #062836; color: #fff; font: 700 .9rem Manrope, sans-serif; }
.dgc-vmodal video { display: block; height: min(88vh, 960px); width: auto; aspect-ratio: 9 / 16; max-width: 88vw; object-fit: contain; background: #000; }
dialog .dgc-x, dialog .dgc-x:focus { position: absolute; z-index: 3; right: -16px; top: -16px; width: 44px; height: 44px; border: 0; border-radius: 50%; display: grid; place-items: center; background: #f6a440; color: #021720; cursor: pointer; box-shadow: 0 10px 24px -8px rgba(0,0,0,.6); transition: background .25s, color .25s, transform .25s; }
dialog .dgc-x svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; }
dialog .dgc-x:hover, dialog .dgc-x:focus-visible { background: #fff; color: #062836; transform: rotate(90deg); }
[class*='dgc-'] .dgc-x, dialog .dgc-x:focus { outline: none; }
@media (max-width: 680px) { dialog .dgc-x { right: 8px; top: 8px; } }
@media (prefers-reduced-motion: reduce) { .elementor .dgc-spin, .elementor .dgc-pan, .elementor .dgc-bob, .elementor .dgc-track.is-ready, .elementor .dgc-rtrack.is-ready, .elementor .dgc-live-dot { animation: none; } }
</style>
<script id="dgc-interactions-js">
(function () {
  // Header: hide the top bar after scrolling (with hysteresis so it never jitters)
  var h = document.querySelector('.dgc-hdr');
  if (h) {
    var on = false;
    var f = function () { var y = window.scrollY; if (!on && y > 80) on = true; else if (on && y < 20) on = false; h.classList.toggle('is-scrolled', on); };
    window.addEventListener('scroll', f, { passive: true }); f();
  }
  // Mobile menu
  var b = document.querySelector('.dgc-burger'), m = document.querySelector('.dgc-navlinks');
  if (b && m) {
    b.setAttribute('aria-label', 'Open menu'); b.setAttribute('aria-expanded', 'false');
    b.addEventListener('click', function () { var o = m.classList.toggle('is-open'); b.setAttribute('aria-expanded', o ? 'true' : 'false'); });
    document.addEventListener('click', function (e) { if (!m.contains(e.target) && !b.contains(e.target)) { m.classList.remove('is-open'); b.setAttribute('aria-expanded', 'false'); } });
  }
  // Back to top
  var t = document.querySelector('.dgc-totop');
  if (t) {
    t.setAttribute('aria-label', 'Back to top');
    var g = function () { t.classList.toggle('is-on', window.scrollY > 600); };
    window.addEventListener('scroll', g, { passive: true }); g();
    t.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
  }
  // Marquees: repeat the items until the row is wide enough, then add one copy for a seamless loop
  document.querySelectorAll('.dgc-track, .dgc-rtrack').forEach(function (tr) {
    var list = tr.firstElementChild; if (!list || tr.classList.contains('is-ready')) return;
    var items = Array.prototype.slice.call(list.children), need = Math.max(window.innerWidth * 1.3, 1600), n = 0;
    while (list.scrollWidth < need && n++ < 20) items.forEach(function (it) { var c = it.cloneNode(true); c.setAttribute('aria-hidden', 'true'); list.appendChild(c); });
    var copy = list.cloneNode(true); copy.setAttribute('aria-hidden', 'true'); tr.appendChild(copy);
    tr.classList.add('is-ready');
  });
  // Video popup (cards link to the MP4; clicking plays it in a dialog)
  var X_ICON = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>';
  var vm = document.createElement('dialog'); vm.className = 'dgc-vmodal'; vm.setAttribute('aria-label', 'Video review');
  vm.innerHTML = '<button class="dgc-x" type="button" aria-label="Close video">' + X_ICON + '</button><div class="dgc-vmodal__frame"><div class="dgc-vmodal__bar"></div><video controls playsinline></video></div>';
  document.body.appendChild(vm);
  var vv = vm.querySelector('video');
  document.addEventListener('click', function (e) {
    var a = e.target.closest('.dgc-vbtn'); if (!a || !vm.showModal) return;
    e.preventDefault();
    var card = a.closest('.dgc-vthumb'), img = a.querySelector('img'), name = card && card.querySelector('.dgc-vname');
    vm.querySelector('.dgc-vmodal__bar').textContent = name ? name.textContent : '';
    if (img) vv.poster = img.currentSrc || img.src;
    vv.src = a.getAttribute('href'); vm.showModal(); vv.play().catch(function () {});
  });
  vm.querySelector('.dgc-x').addEventListener('click', function () { vm.close(); });
  vm.addEventListener('click', function (e) { if (e.target === vm) vm.close(); });
  vm.addEventListener('close', function () { vv.pause(); vv.removeAttribute('src'); vv.load(); });
  // Stats: count up once when the card scrolls into view
  var nums = document.querySelectorAll('.dgc-stat-num');
  var run = function (el) {
    var t = el.firstChild; if (!t || t.nodeType !== 3) return;
    var end = parseFloat(t.nodeValue), dec = (t.nodeValue.split('.')[1] || '').length, t0 = null;
    if (isNaN(end)) return;
    var step = function (ts) { if (!t0) t0 = ts; var k = Math.min(1, (ts - t0) / 1400), e = 1 - Math.pow(1 - k, 3); t.nodeValue = (end * e).toFixed(dec); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  };
  if (nums.length && 'IntersectionObserver' in window && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    var io = new IntersectionObserver(function (es) { es.forEach(function (en) { if (en.isIntersecting) { run(en.target); io.unobserve(en.target); } }); }, { threshold: .6 });
    nums.forEach(function (n) { io.observe(n); });
  }
  // Highlight the current page in the menu
  var norm = function (p) { return p.replace(/\/+$/, '') || '/'; };
  document.querySelectorAll('.dgc-navlink').forEach(function (a) {
    var href = a.getAttribute('href') || (a.querySelector('a') || {}).href; if (!href) return;
    if (norm(new URL(href, location.href).pathname) === norm(location.pathname)) a.classList.add('is-current');
  });
})();
</script>
