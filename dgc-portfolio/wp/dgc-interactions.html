    var rank = {}, seen = {};
    cards.forEach(function (c) { if (cat(c) === 'case') { var ch = key(c, 'dgc-ch-'); seen[ch] = (seen[ch] || 0); rank[cards.indexOf(c)] = seen[ch]++; } });
    var wide = matchMedia('(min-width: 1025px)');
    var cur = 'all', shown = PAGE, sub = 'all', subA = 'all';
    var show = function (el, on) { if (el) el.style.display = on ? '' : 'none'; };
    var press = function (list, active) { list.forEach(function (b) { var on = b === active; b.classList.toggle('is-active', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); }); };
    function render() {
      var list;
      var byCat = function (k) { return cards.filter(function (c) { return cat(c) === k; }); };
      var cases = byCat('case'), firstThree = cases.filter(function (c) { return rank[cards.indexOf(c)] < 3; });
      if (cur === 'all') {
        list = byCat('web').slice(0, 6).concat(byCat('logo'), subA === 'all' ? firstThree.slice(0, 6) : firstThree.filter(function (c) { return key(c, 'dgc-ch-') === subA; }));
      } else if (cur === 'case') {
        list = sub === 'all' ? firstThree : firstThree.filter(function (c) { return key(c, 'dgc-ch-') === sub; });
      } else {
        list = byCat(cur); if (cur === 'web') list = list.slice(0, shown);
      }
      cards.forEach(function (c) { show(c, false); c.classList.remove('is-lift'); c.style.order = ''; });
      heads.forEach(function (h) { show(h, cur === 'all'); h.classList.remove('is-later'); });
      show(subAll, cur === 'all');
      var order = 0, k = 0, group = null, firstHead = true;
      list.forEach(function (c) {
        if (cur === 'all' && cat(c) !== group) {
          group = cat(c); k = 0;
          var h = heads.filter(function (x) { return key(x, 'dgc-g-') === group; })[0];
          if (h) { h.style.order = order++; if (!firstHead) h.classList.add('is-later'); firstHead = false; }
          if (group === 'case' && subAll) subAll.style.order = order++;
        }
        show(c, true); c.style.order = order++;
        if (!c.classList.contains('dgc-c-brand')) c.classList.toggle('is-lift', k++ % 3 === 1);
      });
      grid.classList.toggle('is-staggered', wide.matches);
      if (allCase) allCase.style.display = cur === 'case' ? 'inline-flex' : 'none';
      if (subCase) subCase.style.display = cur === 'case' ? 'flex' : 'none';
      show(more, cur === 'web' && shown < byCat('web').length);
    }
    var openTab = function (f) { cur = f; shown = PAGE; press(tabs, tabs.filter(function (t) { return key(t, 'dgc-f-') === f; })[0]); render(); };
    tabs.forEach(function (t) { t.setAttribute('type', 'button'); t.addEventListener('click', function () { openTab(key(t, 'dgc-f-')); }); });
    [[subCase, function (v) { sub = v; }], [subAll, function (v) { subA = v; }]].forEach(function (pair) {
      if (!pair[0]) return; var bs = [].slice.call(pair[0].querySelectorAll('.dgc-stab'));
      press(bs, bs[0]);
      bs.forEach(function (b) { b.setAttribute('type', 'button'); b.addEventListener('click', function () { press(bs, b); pair[1](key(b, 'dgc-sf-')); render(); }); });
    });
    if (more) { more.setAttribute('type', 'button'); more.addEventListener('click', function () { shown += PAGE; render(); }); }
    var jump = { '#work-web': 'web', '#work-websites': 'web', '#work-logo': 'logo' };
    document.addEventListener('click', function (e) {
      var a = e.target.closest('a[href]'); if (!a) return;
      var h = a.getAttribute('href'); h = h.slice(h.indexOf('#'));
      if (jump[h]) { e.preventDefault(); openTab(jump[h]); sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    });
    wide.addEventListener ? wide.addEventListener('change', render) : wide.addListener(render);
    openTab(jump[location.hash] || 'all');
    if (jump[location.hash]) setTimeout(function () { sec.scrollIntoView({ block: 'start' }); }, 50);
    // touch screens: play the website scroll when a card is in the middle of the screen
    if (matchMedia('(hover: none)').matches && 'IntersectionObserver' in window) {
      var lio = new IntersectionObserver(function (es) { es.forEach(function (en) { en.target.classList.toggle('is-live', en.isIntersecting); }); }, { rootMargin: '-35% 0px -35% 0px' });
      cards.forEach(function (c) { if (cat(c) === 'web') lio.observe(c); });
    }
    // cursor bubble over linked website screens
    if (matchMedia('(hover: hover) and (pointer: fine)').matches) {
      document.documentElement.classList.add('dgc-fine');
      var cur2 = document.createElement('div'); cur2.className = 'dgc-cursor'; cur2.setAttribute('aria-hidden', 'true'); cur2.innerHTML = 'Visit<br>site ↗'; document.body.appendChild(cur2);
      grid.addEventListener('pointermove', function (e) { var d = e.target.closest('a.dgc-device'); cur2.classList.toggle('on', !!d); cur2.style.translate = e.clientX + 'px ' + e.clientY + 'px'; });
      grid.addEventListener('pointerleave', function () { cur2.classList.remove('on'); });
    }
    // brand kit popup (logo cards carry a hidden copy of the branding panel)
    var km = document.createElement('dialog'); km.className = 'dgc-kitmodal'; km.setAttribute('aria-label', 'Brand kit');
    km.innerHTML = '<button class="dgc-x" type="button" aria-label="Close brand kit">' + X_ICON + '</button><div class="dgc-kitmodal__body elementor"></div>';
    document.body.appendChild(km);
    var kb = km.querySelector('.dgc-kitmodal__body');
    sec.querySelectorAll('.dgc-lbtn').forEach(function (b) {
      b.setAttribute('type', 'button');
      b.addEventListener('click', function () {
        var kit = b.closest('.dgc-work').querySelector('.dgc-kit'); if (!kit || !km.showModal) return;
        kb.innerHTML = ''; var c = kit.cloneNode(true); kb.appendChild(c); kb.scrollTop = 0;
        km.showModal(); document.documentElement.style.overflow = 'hidden';
      });
    });
    km.querySelector('.dgc-x').addEventListener('click', function () { km.close(); });
    km.addEventListener('click', function (e) { if (e.target === km) km.close(); });
    km.addEventListener('close', function () { document.documentElement.style.overflow = ''; });
  }
  // case study popup (cards link to the full case-study image)
  var cm = document.createElement('dialog'); cm.className = 'dgc-cmodal'; cm.setAttribute('aria-label', 'Case study');
  cm.innerHTML = '<button class="dgc-x" type="button" aria-label="Close case study">' + X_ICON + '</button><div class="dgc-cmodal__bar"><span></span><b></b></div><div class="dgc-cmodal__scroll"><p class="dgc-cmodal__load">Loading case study…</p><img alt="" hidden></div>';
  document.body.appendChild(cm);
  var cImg = cm.querySelector('img'), cLoad = cm.querySelector('.dgc-cmodal__load');
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a.dgc-case'); if (!a || !cm.showModal) return;
    e.preventDefault();
    var t = a.querySelector('.dgc-case-title'), l = a.querySelector('.dgc-case-label');
    cm.querySelector('.dgc-cmodal__bar b').textContent = t ? t.textContent : '';
    cm.querySelector('.dgc-cmodal__bar span').textContent = (l ? l.textContent : '') + ' case study';
    cImg.hidden = true; cLoad.hidden = false;
    cImg.onload = function () { cLoad.hidden = true; cImg.hidden = false; };
    cImg.alt = (t ? t.textContent : '') + ' case study'; cImg.src = a.getAttribute('href');
    cm.querySelector('.dgc-cmodal__scroll').scrollTop = 0;
    cm.showModal(); document.documentElement.style.overflow = 'hidden';
  });
  cm.querySelector('.dgc-x').addEventListener('click', function () { cm.close(); });
  cm.addEventListener('click', function (e) { if (e.target === cm) cm.close(); });
  cm.addEventListener('close', function () { document.documentElement.style.overflow = ''; });
  // Highlight the current page in the menu
  var norm = function (p) { return p.replace(/\/+$/, '') || '/'; };
  document.querySelectorAll('.dgc-navlink').forEach(function (a) {
    var href = a.getAttribute('href') || (a.querySelector('a') || {}).href; if (!href) return;
    if (norm(new URL(href, location.href).pathname) === norm(location.pathname)) a.classList.add('is-current');
  });
})();
</script>
